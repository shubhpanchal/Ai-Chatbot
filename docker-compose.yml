services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_chat_api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    environment:
      - APP_NAME=AI Chat API
      - APP_ENV=development
      - API_V1_PREFIX=/api/v1
      - LOG_LEVEL=INFO
      - DEBUG=false
      - HTTP_SERVER_TIMEOUT_SECONDS=60
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_chat_db
      - DB_CONNECT_TIMEOUT_SECONDS=5
      - DB_COMMAND_TIMEOUT_SECONDS=10
      - REDIS_URL=redis://redis:6379/0
      - REDIS_SOCKET_TIMEOUT_SECONDS=2
      - REDIS_CONNECT_TIMEOUT_SECONDS=5
      - API_KEY_SECRET=dev-secret-pepper-key-minimum-32-chars-change-in-production
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW_SECONDS=60
      - IDEMPOTENCY_TTL_SECONDS=86400
      - IDEMPOTENCY_LOCK_TIMEOUT_SECONDS=60
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test-key-placeholder}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-2048}
      - OPENAI_TIMEOUT_SECONDS=30
      - OPENAI_MAX_RETRIES=3
      - DEFAULT_SYSTEM_PROMPT=You are a helpful, accurate, and concise AI assistant.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_chat_network

  postgres:
    image: postgres:16-alpine
    container_name: ai_chat_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_chat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_chat_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_chat_network

  redis:
    image: redis:7-alpine
    container_name: ai_chat_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_chat_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai_chat_network:
    driver: bridge
